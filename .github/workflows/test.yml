name: test-install

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catches upstream installer changes

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: |
          $env:CCB_EXTRAS = "node"
          ./install.ps1
      - name: Verify in a fresh shell
        shell: ${{ matrix.shell }}
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine')
          claude --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not [Environment]::GetEnvironmentVariable('CLAUDE_CODE_GIT_BASH_PATH','User')) { throw 'CLAUDE_CODE_GIT_BASH_PATH not set' }
      - name: Second run is idempotent
        shell: ${{ matrix.shell }}
        run: ./install.ps1

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: CCB_EXTRAS=node bash install.sh
      - name: Verify in a fresh login shell
        run: bash -lc 'claude --version'
      - run: bash install.sh

  containers:
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:22.04', 'alpine:3.20']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Bare image needs bash + curl to start (this is what a user types)
        run: |
          if command -v apk >/dev/null; then apk add --no-cache bash curl; else apt-get update -qq && apt-get install -y -qq curl ca-certificates; fi
      - uses: actions/checkout@v4
      - run: bash install.sh
      - run: bash -lc 'claude --version'
